name: "Download Button Action"

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get release version
        id: get-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              echo "❌ Error: No releases found in the repository."
              exit 1
            fi
            echo "VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Update README.md
        env:
          GITHUB_USER: "Showtc"
          REPO: "hanover-font"
          FORMAT: "zip"
          VERSION: "${{ steps.get-version.outputs.VERSION }}"
          HEIGHT: "90"
          BEGIN_TAG: "<!-- BEGIN LATEST DOWNLOAD BUTTON -->"
          END_TAG: "<!-- END LATEST DOWNLOAD BUTTON -->"
        run: |
          if [ -z "${{ env.VERSION }}" ]; then
            echo "❌ Error: VERSION is empty. Cannot update README."
            exit 1
          fi

          # Utilisation de balises HTML pures <a> et <img> pour une compatibilité garantie avec GitHub
          perl -0777 -i -pe 's#(\Q${{ env.BEGIN_TAG }}\E)(?:.|\n)*?(\Q${{ env.END_TAG }}\E)#${1}\n<a href="https://github.com/${{ env.GITHUB_USER }}/${{ env.REPO }}/archive/${{ env.VERSION }}.${{ env.FORMAT }}"><img src="assets/github-stable.svg" alt="Download ${{ env.FORMAT }}" height="${{ env.HEIGHT }}"></a>\n${2}#g' README.md

          echo "Successfully updated README.md with version ${{ env.VERSION }} and height ${{ env.HEIGHT }}px"

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "docs(readme): bump download button version to ${{ steps.get-version.outputs.VERSION }}"
          default_author: github_actions
          token: ${{ github.token }}
          push: true
