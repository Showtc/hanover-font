name: "Download Button Action"

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release version
        id: get-version
        run: |
          # Use the release event tag if available, otherwise fetch the latest via GitHub CLI
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            echo "VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Update README.md
        env:
          GITHUB_USER: "Showtc"
          REPO: "hanover-font"
          FORMAT: "zip"
          VERSION: "${{ steps.get-version.outputs.VERSION }}"
          BEGIN_TAG: "<!-- BEGIN LATEST DOWNLOAD BUTTON -->"
          END_TAG: "<!-- END LATEST DOWNLOAD BUTTON -->"
        run: |
          if [ -z "${{ env.VERSION }}" ]; then
            echo "Error: VERSION is empty. Cannot update README."
            exit 1
          fi

          # Use perl in-place (-i) with \Q...\E to safely escape literal strings in regex
          perl -0777 -i -pe 's#(\Q${{ env.BEGIN_TAG }}\E)(?:.|\n)*?(\Q${{ env.END_TAG }}\E)#${1}\n[![Download ${{ env.FORMAT }}](assets/github-stable.svg "Download ${{ env.FORMAT }}")](https://github.com/${{ env.GITHUB_USER }}/${{ env.REPO }}/archive/${{ env.VERSION }}.${{ env.FORMAT }})\n${2}#g' README.md

          echo "Successfully updated README.md with version ${{ env.VERSION }}"

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "docs(readme): bump download button version to ${{ steps.get-version.outputs.VERSION }}"
          default_author: github_actions
          branch: main
